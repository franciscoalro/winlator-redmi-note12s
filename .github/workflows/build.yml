name: Build Winlator Redmi Note 12s

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Cache Android SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/cmdline-tools
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/cmake
            /usr/local/lib/android/sdk/licenses
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Install cmdline-tools (if not cached)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p "$ANDROID_HOME"
          curl -sSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdtools-extract
          mv /tmp/cmdtools-extract/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          rm -rf /tmp/cmdline-tools.zip /tmp/cmdtools-extract

      - name: Configure sdkmanager on PATH and accept licenses
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --version

      - name: Install Android NDK 24.0.8215888 and CMake 3.22.1
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate keystore for release signing
        run: |
          set -e
          KEYSTORE_PASS="${KEYSTORE_PASS:-winlator-rn12s}"
          KEYALIAS="${KEYALIAS:-winlator_rn12s}"
          keytool -genkeypair \
            -keystore "${{ github.workspace }}/app/release.keystore" \
            -alias "$KEYALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
            -dname "CN=Winlator Redmi Note 12s, OU=Mobile, O=WinlatorRN12S, L=BR, ST=BR, C=BR" > /dev/null 2>&1
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ github.workspace }}/app/release.keystore" "$KEYSTORE_PASS" "$KEYALIAS" "$KEYSTORE_PASS" \
            > "${{ github.workspace }}/app/keystore.properties"

      - name: Set up gradle.properties for CI
        run: |
          printf 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8\norg.gradle.parallel=true\norg.gradle.caching=true\nandroid.useAndroidX=true\nandroid.enableJetifier=true\nandroid.nonFinalResIds=false\nandroid.nonTransitiveRClass=false\n' \
            > "${{ github.workspace }}/app/gradle.properties"

      - name: Grant execute permission for gradlew
        run: chmod +x app/gradlew

      - name: Build Debug APK (arm64-v8a)
        working-directory: app
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: winlator-redmi-note12s-debug
          path: app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build Release APK (arm64-v8a, signed)
        working-directory: app
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Upload signed Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: winlator-redmi-note12s-release
          path: app/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: ignore
